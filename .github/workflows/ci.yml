# Required PR checks. Policy: docs/git-workflow.md.
# Required PR gates only. No separate AI review workflow (decision #17).
# Job "Terraform plan" is not a required check. It skips while
# WIF_PROVIDER or WIF_SERVICE_ACCOUNT is empty so an unset variable
# cannot turn the pull request red. docs/git-workflow.md.

name: CI  # title shown in GitHub Actions

on:  # which GitHub events start this workflow
  pull_request:  # run when a PR is opened or updated

concurrency:  # stop overlapping runs of the same PR
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}  # one run per PR
  cancel-in-progress: true  # stop old runs when you push again

permissions:  # least privilege for every job below
  contents: read  # this workflow only needs to read the repo

env:  # variables available to every job
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci  # dummy URL so prisma generate can run (no real DB)

jobs:  # the required checks before merge
  lint:  # eslint — style/syntax problems, does not rewrite files
    name: Lint  # label in the GitHub checks list
    runs-on: ubuntu-latest  # GitHub-hosted Linux VM
    defaults:  # defaults for every `run:` step in this job
      run:  # apply only to shell steps, not to `uses:`
        working-directory: backend  # all `run:` steps in this job start in backend/
    steps:  # ordered list of actions/commands
      - name: Checkout  # copy the PR code onto the VM
        uses: actions/checkout@v4  # official GitHub checkout action
      - name: Setup Node 24  # same major as backend/Dockerfile
        uses: actions/setup-node@v4  # official Node installer
        with:  # inputs for that action
          node-version: '24'  # major version to install
          cache: npm  # reuse downloaded packages between runs
          cache-dependency-path: backend/package-lock.json  # lockfile that defines the cache key
      - name: Install deps  # exact versions from package-lock.json
        run: npm ci  # clean install from the lockfile, not `npm install`
      - name: Generate Prisma client  # generated/ is gitignored — lint needs it
        run: npx prisma generate  # writes the client from schema.prisma
      - name: Run eslint  # fail on lint errors; no --fix
        run: npm run lint:check  # eslint --max-warnings=0

  typecheck:  # tsc — TypeScript type errors
    name: Typecheck  # label in the GitHub checks list
    runs-on: ubuntu-latest  # GitHub-hosted Linux VM
    defaults:  # defaults for every `run:` step in this job
      run:  # apply only to shell steps, not to `uses:`
        working-directory: backend  # all `run:` steps in this job start in backend/
    steps:  # ordered list of actions/commands
      - name: Checkout  # copy the PR code onto the VM
        uses: actions/checkout@v4  # official GitHub checkout action
      - name: Setup Node 24  # same major as backend/Dockerfile
        uses: actions/setup-node@v4  # official Node installer
        with:  # inputs for that action
          node-version: '24'  # major version to install
          cache: npm  # reuse downloaded packages between runs
          cache-dependency-path: backend/package-lock.json  # lockfile that defines the cache key
      - name: Install deps  # exact versions from package-lock.json
        run: npm ci  # clean install from the lockfile, not `npm install`
      - name: Generate Prisma client  # generated/ is gitignored — tsc needs it
        run: npx prisma generate  # writes the client from schema.prisma
      - name: Run tsc  # compile-check only, does not emit JS
        run: npm run typecheck  # tsc --noEmit -p tsconfig.build.json

  test:  # jest — unit tests
    name: Tests  # label in the GitHub checks list
    runs-on: ubuntu-latest  # GitHub-hosted Linux VM
    defaults:  # defaults for every `run:` step in this job
      run:  # apply only to shell steps, not to `uses:`
        working-directory: backend  # all `run:` steps in this job start in backend/
    steps:  # ordered list of actions/commands
      - name: Checkout  # copy the PR code onto the VM
        uses: actions/checkout@v4  # official GitHub checkout action
      - name: Setup Node 24  # same major as backend/Dockerfile
        uses: actions/setup-node@v4  # official Node installer
        with:  # inputs for that action
          node-version: '24'  # major version to install
          cache: npm  # reuse downloaded packages between runs
          cache-dependency-path: backend/package-lock.json  # lockfile that defines the cache key
      - name: Install deps  # exact versions from package-lock.json
        run: npm ci  # clean install from the lockfile, not `npm install`
      - name: Generate Prisma client  # generated/ is gitignored — tests need it
        run: npx prisma generate  # writes the client from schema.prisma
      - name: Run jest  # --passWithNoTests until the first *.spec.ts exists
        run: npx jest --passWithNoTests  # unit tests; do not fail if there are none yet

  docker:  # image must build even if npm scripts pass
    name: Docker  # label in the GitHub checks list
    runs-on: ubuntu-latest  # GitHub-hosted Linux VM
    steps:  # ordered list of actions/commands
      - name: Checkout  # copy the PR code onto the VM
        uses: actions/checkout@v4  # official GitHub checkout action
      - name: Build backend image  # no push — that belongs in deploy.yml
        run: docker build -t nissim-backend:ci ./backend  # prove the Dockerfile still builds

  commitlint:  # every commit on the PR must be Conventional Commits (feat/fix/infra/…)
    name: Commitlint  # label in the GitHub checks list
    runs-on: ubuntu-latest  # GitHub-hosted Linux VM
    steps:  # ordered list of actions/commands
      - name: Checkout  # copy the PR code onto the VM
        uses: actions/checkout@v4  # official GitHub checkout action
        with:  # inputs for that action
          fetch-depth: 0  # full history — needed to lint all PR commits, not just the last one
      - name: Lint commit messages  # feat:/fix:/infra: etc. — see commitlint.config.mjs
        uses: wagoid/commitlint-github-action@v6  # compares PR commits against the config

  terraform:  # fmt + validate. Plan is the separate job below, and it is not required.
    name: Terraform  # label in the GitHub checks list
    runs-on: ubuntu-latest  # GitHub-hosted Linux VM
    steps:  # ordered list of actions/commands
      - name: Checkout  # copy the PR code onto the VM
        uses: actions/checkout@v4  # official GitHub checkout action
      - name: Setup Terraform  # install the terraform CLI on the VM
        uses: hashicorp/setup-terraform@v3  # official Terraform installer
        with:  # inputs for that action
          terraform_version: 1.15.8  # match local terraform
          terraform_wrapper: false  # use real terraform exit codes
      - name: Check formatting  # fail if .tf files are not `terraform fmt` clean
        working-directory: infra/terraform  # run from the terraform root
        run: terraform fmt -check -recursive  # check only; does not rewrite files
      - name: Validate bootstrap  # one-time GCS bucket / APIs
        working-directory: infra/terraform/bootstrap  # bootstrap is a separate root module
        run: |  # two commands in one step
          terraform init -backend=false  # download providers; do not talk to GCS state
          terraform validate  # syntax/schema check, no GCP apply
      - name: Validate dev  # stage-1 modules — fail if the files are invalid
        working-directory: infra/terraform/environments/dev  # dev root module
        run: |  # two commands in one step
          terraform init -backend=false  # download providers; do not talk to GCS state
          terraform validate  # syntax/schema check, no GCP apply
      - name: Validate prod  # stage-1 modules — fail if the files are invalid
        working-directory: infra/terraform/environments/prod  # prod root module
        run: |  # two commands in one step
          terraform init -backend=false  # download providers; do not talk to GCS state
          terraform validate  # syntax/schema check, no GCP apply
      - name: Validate github  # environments + branch protection — no apply, no token
        working-directory: infra/terraform/github  # GitHub provider root
        run: |  # two commands in one step
          terraform init -backend=false  # download the GitHub provider; do not talk to GCS
          terraform validate  # schema check; does not call the GitHub API

  # Not a required check. Name must stay out of github_branch_protection
  # contexts until WIF is configured and this job is actually running.
  terraform-plan:
    name: Terraform plan  # check name — do not add this to branch protection yet
    # Same skip as deploy.yml. Empty vars skip the job; they do not fail it.
    # environment: dev is what makes these the dev Environment variables.
    # Prod WIF requires refs/heads/main, and a pull_request ref is
    # refs/pull/N/merge, so this job cannot mint a prod token.
    if: ${{ vars.WIF_PROVIDER != '' && vars.WIF_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest  # GitHub-hosted Linux VM
    environment: dev  # no required reviewer; vars are dev's WIF pair
    permissions:  # job permissions replace the workflow permissions
      contents: read  # checkout
      id-token: write  # OIDC token for Workload Identity Federation
      pull-requests: write  # comment the plan; the token is the workflow token, not a PAT in git
    env:  # Terraform reads TF_VAR_* itself. The value is not a secret.
      TF_VAR_billing_account_id: ${{ vars.TF_VAR_billing_account_id }}
    steps:
      - name: Checkout  # copy the PR code onto the VM
        uses: actions/checkout@v4  # official GitHub checkout action
      - name: Require billing account id  # plan cannot prompt, and the id is not in git
        id: billing  # later steps read this outcome
        run: |  # fail with the click-path hint; do not print the value
          if [ -z "$TF_VAR_billing_account_id" ]; then
            echo "Set dev Environment variable TF_VAR_billing_account_id (Variables, not Secrets). See docs/git-workflow.md." | tee "$GITHUB_WORKSPACE/plan-error.txt"
            exit 1
          fi
      - name: Authenticate to Google Cloud  # WIF credentials file for Terraform, not a JSON key
        id: auth  # plan steps run only after this succeeds
        if: steps.billing.outcome == 'success'  # implied success(); skip when the id is missing
        uses: google-github-actions/auth@v2  # official Google auth action
        with:  # inputs for that action
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}  # dev Environment variable
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}  # dev Environment variable
      - name: Setup Terraform  # same version as the validate job
        id: setup  # plan steps run only after the CLI is installed
        if: steps.auth.outcome == 'success'  # do not init without credentials
        uses: hashicorp/setup-terraform@v3  # official Terraform installer
        with:  # inputs for that action
          terraform_version: 1.15.8  # match the Terraform job
          terraform_wrapper: false  # real exit codes; the comment step posts the summary
      - name: Plan dev  # read-only — never terraform apply on a pull request
        id: plan_dev  # outcome is reported in the PR comment
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}  # !cancelled() so a later root still plans
        continue-on-error: true  # still plan prod and comment if this root fails
        working-directory: infra/terraform/environments/dev  # dev root module
        run: |  # init against GCS, then plan; the binary plan file is deleted
          set +e
          set -o pipefail
          {
            terraform init -input=false
            terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan
          } 2>&1 | tee "$GITHUB_WORKSPACE/plan-dev.txt"
          status=${PIPESTATUS[0]}
          rm -f tfplan
          exit "$status"
      - name: Plan prod  # read-only plan of the prod root, still the dev WIF identity
        id: plan_prod  # outcome is reported in the PR comment
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}  # still plan prod if the dev plan failed
        continue-on-error: true  # the comment should show a prod failure too
        working-directory: infra/terraform/environments/prod  # prod root module
        run: |  # read-only. Prod changes ship from deploy.yml on main.
          set +e
          set -o pipefail
          {
            terraform init -input=false
            terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan
          } 2>&1 | tee "$GITHUB_WORKSPACE/plan-prod.txt"
          status=${PIPESTATUS[0]}
          rm -f tfplan
          exit "$status"
      - name: Comment plan on the pull request  # sticky comment; update in place
        if: always()  # post the summary whether the plans failed or passed
        uses: actions/github-script@v7  # official GitHub script action; uses GITHUB_TOKEN
        env:  # step outcomes only — plan text is read from files, not interpolated
          DEV_OUTCOME: ${{ steps.plan_dev.outcome }}
          PROD_OUTCOME: ${{ steps.plan_prod.outcome }}
          BILLING_OUTCOME: ${{ steps.billing.outcome }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- nissim-terraform-plan -->'
            const max = 20000
            function read(path) {
              if (!fs.existsSync(path)) return '_No output._'
              let text = fs.readFileSync(path, 'utf8').replace(/\r\n/g, '\n').replace(/```/g, "'''")
              if (text.length > max) {
                text = text.slice(0, max) + '\n\n… truncated. The job log has the full plan.'
              }
              return text
            }
            const dev = read(process.env.GITHUB_WORKSPACE + '/plan-dev.txt')
            const prod = read(process.env.GITHUB_WORKSPACE + '/plan-prod.txt')
            const billing = read(process.env.GITHUB_WORKSPACE + '/plan-error.txt')
            const body = [
              marker,
              '## Terraform plan',
              '',
              'Read-only. This job does not apply. Prod apply stays on `main` in `deploy.yml`.',
              '',
              '| Root | Result |',
              '| --- | --- |',
              '| billing account id | ' + process.env.BILLING_OUTCOME + ' |',
              '| dev | ' + process.env.DEV_OUTCOME + ' |',
              '| prod | ' + process.env.PROD_OUTCOME + ' |',
              '',
              billing === '_No output._' ? '' : '### billing\n\n' + billing,
              '',
              '<details><summary>dev</summary>',
              '',
              '```',
              dev,
              '```',
              '',
              '</details>',
              '',
              '<details><summary>prod</summary>',
              '',
              '```',
              prod,
              '```',
              '',
              '</details>',
              '',
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker) && comment.user && comment.user.login === 'github-actions[bot]')
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
      - name: Fail when a plan failed  # continue-on-error above must not leave the job green
        if: ${{ always() && (steps.billing.outcome == 'failure' || steps.plan_dev.outcome == 'failure' || steps.plan_prod.outcome == 'failure') }}
        run: exit 1  # the comment is already posted
